{{- range $ingress := default (list .Values.ingress) .Values.ingresses }}
{{- if $ingress.enabled -}}
{{- $fullName := include "helm_chart.fullname" $ -}}
{{- $svcPort := $.Values.service.externalPort -}}
{{- $gitVersion := $.Capabilities.KubeVersion.GitVersion -}}
{{- $annotations := default dict $ingress.annotations }}
{{- if and $ingress.className (not (semverCompare ">=1.18-0" $gitVersion)) }}
  {{- if not (hasKey $annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set $annotations "kubernetes.io/ingress.class" $ingress.className}}
  {{- end }}
{{- end }}
{{- /*
Template each value on its own, never the serialised map. A Go template error
quotes its whole input, so one broken annotation would print every other value,
secrets included. Rendering per value also stops a resolved secret containing
{{ }} from being executed.
*/ -}}
{{- $rendered := dict }}
{{- range $annKey, $annValue := $annotations }}
  {{- $_ := set $rendered $annKey (tpl (toString $annValue) $) }}
{{- end }}
{{- if semverCompare ">=1.19-0" $gitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" $gitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ default $fullName $ingress.name }}
  {{- with $rendered }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}
spec:
  {{- if and $ingress.className (semverCompare ">=1.18-0" $gitVersion) }}
  ingressClassName: {{ $ingress.className }}
  {{- end }}
  {{- if $ingress.tls }}
  tls:
    {{- range $ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ tpl . $ | quote }}
        {{- end }}
      secretName: {{ tpl .secretName $ }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $ingress.hosts }}
    - host: {{ tpl .host $ | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and .pathType (semverCompare ">=1.18-0" $gitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $gitVersion }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
              {{- else -}}
              serviceName: {{ $fullName }}
              servicePort: {{ $svcPort }}
              {{- end }}
          {{- end }}
    {{- end }}
---
  {{- end }}
{{- end }}
